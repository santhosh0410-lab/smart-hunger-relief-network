spring.application.name=Smart Hunger Relief Network

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hunger_relief_network}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_LOCAL_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:YOUR_LOCAL_JWT_SECRET}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

server.port=${PORT:8080}
server.address=0.0.0.0